name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Jellyfin ${{ matrix.server }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: '10.11'
            framework: net9.0
            sdk: '9.0.x'
          - server: '12.0'
            framework: net10.0
            sdk: '10.0.x'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Choose plugin version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tags must look like v1.2.3.4" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: >-
          dotnet build
          src/Jellyfin.Plugin.ContentRequests/Jellyfin.Plugin.ContentRequests.csproj
          --configuration Release
          --property:TargetFrameworks=${{ matrix.framework }}
          --property:PluginVersion=${{ steps.version.outputs.value }}

      - name: Package
        shell: bash
        run: |
          package_dir="${RUNNER_TEMP}/content-requests"
          mkdir -p "$package_dir"
          cp "src/Jellyfin.Plugin.ContentRequests/bin/Release/${{ matrix.framework }}/Jellyfin.Plugin.ContentRequests.dll" "$package_dir/"
          cp README.md LICENSE "$package_dir/"
          archive="content-requests_${{ matrix.server }}_${{ steps.version.outputs.value }}.zip"
          (cd "$package_dir" && zip -9 -r "$GITHUB_WORKSPACE/$archive" .)

      - uses: actions/upload-artifact@v4
        with:
          name: content-requests-${{ matrix.server }}
          path: content-requests_${{ matrix.server }}_${{ steps.version.outputs.value }}.zip
          if-no-files-found: error

  release:
    name: GitHub release and Jellyfin manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: content-requests-release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: content-requests-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.zip \
              --title "Content Requests ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Update Jellyfin repository manifest
        run: >-
          python3 scripts/update_manifest.py
          --repository "$GITHUB_REPOSITORY"
          --tag "$GITHUB_REF_NAME"
          --artifacts dist

      - name: Publish manifest on the default branch
        shell: bash
        run: |
          cp manifest.json "$RUNNER_TEMP/manifest.json"
          git fetch origin "$GITHUB_DEFAULT_BRANCH"
          git checkout -B "$GITHUB_DEFAULT_BRANCH" "origin/$GITHUB_DEFAULT_BRANCH"
          cp "$RUNNER_TEMP/manifest.json" manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: publish ${GITHUB_REF_NAME} in plugin manifest"
          git push origin "$GITHUB_DEFAULT_BRANCH"
