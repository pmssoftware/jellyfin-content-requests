<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Content Requests</title></head>
<body>
<div id="contentRequestsPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-input,emby-select,emby-checkbox">
<div data-role="content"><div class="content-primary">
    <h2 id="crPageTitle" class="sectionTitle">Content Requests</h2>
    <nav class="cr-subnav" aria-label="Content Requests">
        <button id="crRequestsNav" is="emby-button" type="button" class="raised button-submit emby-button" data-panel="requests">Requests</button>
        <button id="crSettingsNav" is="emby-button" type="button" class="raised button-alt emby-button" data-panel="settings">Settings</button>
    </nav>

    <section id="crRequestsPanel">
        <div class="sectionTitleContainer flex align-items-center">
            <h3 id="crRequestsTitle" class="sectionTitle">Requests</h3>
            <button id="contentRequestsRefresh" is="emby-button" type="button" class="raised button-alt headerHelpButton emby-button">Refresh</button>
        </div>
        <p id="contentRequestsSummary" class="fieldDescription"></p>
        <div class="selectContainer">
            <label id="crShowLabel" class="selectLabel" for="contentRequestsFilter">Show</label>
            <select id="contentRequestsFilter" is="emby-select" class="emby-select-withcolor emby-select">
                <option value="All">All requests</option><option value="Pending">Pending</option>
                <option value="Approved">Approved</option><option value="Available">Available</option>
                <option value="Declined">Declined</option>
            </select>
        </div>
        <div id="contentRequestsError" class="cr-error" hidden></div>
        <div id="contentRequestsList" class="verticalSection"></div>
    </section>

    <section id="crSettingsPanel" hidden>
        <h3 id="crSettingsTitle" class="sectionTitle">Settings</h3>
        <p id="crSettingsIntro" class="fieldDescription">Controls the CustomTabs entry shown on the Jellyfin home page.</p>
        <form id="crSettingsForm" class="cr-settings-form">
            <div class="checkboxContainer checkboxContainer-withDescription">
                <label class="emby-checkbox-label">
                    <input id="crTabEnabled" is="emby-checkbox" type="checkbox" class="emby-checkbox">
                    <span id="crTabEnabledLabel">Show request tab to users</span>
                </label>
                <div id="crTabEnabledHelp" class="fieldDescription checkboxFieldDescription">Hide or show the tab for all signed-in users.</div>
            </div>
            <div class="inputContainer">
                <label id="crTabNameLabel" class="inputLabel inputLabelUnfocused" for="crTabName">Tab name</label>
                <input id="crTabName" is="emby-input" type="text" maxlength="40" required class="emby-input">
                <div id="crTabNameHelp" class="fieldDescription">The title displayed beside Home and Favorites.</div>
            </div>
            <button id="crSettingsSave" is="emby-button" type="submit" class="raised button-submit block emby-button">Save</button>
            <div id="crSettingsMessage" class="cr-message" role="status" aria-live="polite"></div>
        </form>
    </section>
</div></div>

<style>
    #contentRequestsPage .cr-subnav{display:flex;gap:.65rem;margin:1.25rem 0 2rem}#contentRequestsPage .cr-subnav button{min-width:8rem}
    #contentRequestsList{display:grid;gap:1rem;margin-top:1.5rem}#contentRequestsList .cr-item{padding:1rem 1.1rem;border:1px solid rgba(255,255,255,.14);border-radius:.5rem;background:rgba(255,255,255,.035)}
    #contentRequestsList .cr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem}#contentRequestsList .cr-title{margin:0;font-size:1.16rem;overflow-wrap:anywhere}
    #contentRequestsList .cr-type{display:inline-block;margin-top:.35rem;padding:.15rem .55rem;border-radius:999px;background:rgba(0,164,220,.2);color:#61c9ed;font-size:.85rem}
    #contentRequestsList .cr-meta{margin:.65rem 0 0;opacity:.72}#contentRequestsList .cr-comment{margin:.85rem 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
    #contentRequestsList .cr-actions{display:flex;align-items:flex-end;gap:.7rem;margin-top:1rem}#contentRequestsList .cr-actions .selectContainer{flex:1 1 14rem;margin:0}
    #contentRequestsList .cr-delete{flex:0 0 auto;margin-bottom:.1rem}#contentRequestsList .cr-empty{opacity:.72;padding:2rem 0;text-align:center}
    #contentRequestsPage .cr-settings-form{margin-top:1.5rem}#contentRequestsPage .cr-error{color:#ff7b7b;margin:1rem 0}#contentRequestsPage .cr-message{min-height:1.5rem;margin-top:.8rem}
    #contentRequestsPage .cr-message.success{color:#59c589}#contentRequestsPage .cr-message.error{color:#ff7b7b}
    @media(max-width:40rem){#contentRequestsList .cr-head,#contentRequestsList .cr-actions{display:block}#contentRequestsList .cr-delete{width:100%;margin-top:.75rem}}
</style>

<script>
(() => {
    const page=document.querySelector('#contentRequestsPage'),list=page.querySelector('#contentRequestsList'),filter=page.querySelector('#contentRequestsFilter');
    const summary=page.querySelector('#contentRequestsSummary'),errorBox=page.querySelector('#contentRequestsError'),refresh=page.querySelector('#contentRequestsRefresh');
    const settingsForm=page.querySelector('#crSettingsForm'),settingsMessage=page.querySelector('#crSettingsMessage'),statuses=['Pending','Approved','Available','Declined'];
    const dictionaries={
        en:{title:'Content Requests',requests:'Requests',settings:'Settings',refresh:'Refresh',show:'Show',all:'All requests',Pending:'Pending',Approved:'Approved',Available:'Available',Declined:'Declined',Movie:'Movie','TV Show':'TV show',Anime:'Anime',Documentary:'Documentary',Other:'Other',status:'Status',delete:'Delete',requestedBy:'Requested by',total:(a,b)=>a+' total · '+b+' pending',emptyAll:'No requests yet.',emptyStatus:s=>'No '+s.toLowerCase()+' requests.',loadError:'Could not load content requests. Check the Jellyfin log for details.',updateError:'The request status could not be updated.',deleteError:'The request could not be deleted.',confirmDelete:'Delete this content request?',settingsIntro:'Controls the CustomTabs entry shown on the Jellyfin home page.',enabled:'Show request tab to users',enabledHelp:'Hide or show the tab for all signed-in users.',tabName:'Tab name',tabNameHelp:'The title displayed beside Home and Favorites.',save:'Save',saved:'Settings saved. Refresh Jellyfin Web to apply them to the home tab.',settingsLoadError:'Could not load settings.',settingsSaveError:'Could not save settings.'},
        de:{title:'Inhaltsanfragen',requests:'Anfragen',settings:'Einstellungen',refresh:'Aktualisieren',show:'Anzeigen',all:'Alle Anfragen',Pending:'Offen',Approved:'Genehmigt',Available:'Verfügbar',Declined:'Abgelehnt',Movie:'Film','TV Show':'Serie',Anime:'Anime',Documentary:'Dokumentation',Other:'Sonstiges',status:'Status',delete:'Löschen',requestedBy:'Angefragt von',total:(a,b)=>a+' insgesamt · '+b+' offen',emptyAll:'Noch keine Anfragen.',emptyStatus:s=>'Keine Anfragen mit Status „'+s+'“.',loadError:'Die Inhaltsanfragen konnten nicht geladen werden. Prüfe das Jellyfin-Protokoll.',updateError:'Der Status konnte nicht aktualisiert werden.',deleteError:'Die Anfrage konnte nicht gelöscht werden.',confirmDelete:'Diese Inhaltsanfrage löschen?',settingsIntro:'Steuert den CustomTabs-Eintrag auf der Jellyfin-Startseite.',enabled:'Anfrage-Tab für Benutzer anzeigen',enabledHelp:'Blendet den Tab für alle angemeldeten Benutzer ein oder aus.',tabName:'Name des Tabs',tabNameHelp:'Der Titel, der neben Startseite und Favoriten angezeigt wird.',save:'Speichern',saved:'Einstellungen gespeichert. Lade Jellyfin Web neu, um den Startseiten-Tab zu aktualisieren.',settingsLoadError:'Die Einstellungen konnten nicht geladen werden.',settingsSaveError:'Die Einstellungen konnten nicht gespeichert werden.'}
    };
    function selectedLanguage(){const c=[document.documentElement.lang,navigator.language];try{c.unshift(localStorage.getItem('language'))}catch(_){}return c.some(x=>String(x||'').toLowerCase().startsWith('de'))?'de':'en'}
    const language=selectedLanguage(),text=dictionaries[language],value=(item,name)=>item[name]??item[name.charAt(0).toLowerCase()+name.slice(1)];let requests=[],busyCount=0;
    function applyTranslations(){document.documentElement.lang=language;document.title=text.title;page.querySelector('#crPageTitle').textContent=text.title;page.querySelector('#crRequestsNav').textContent=text.requests;page.querySelector('#crSettingsNav').textContent=text.settings;page.querySelector('#crRequestsTitle').textContent=text.requests;refresh.textContent=text.refresh;page.querySelector('#crShowLabel').textContent=text.show;Array.from(filter.options).forEach(o=>o.textContent=o.value==='All'?text.all:text[o.value]);page.querySelector('#crSettingsTitle').textContent=text.settings;page.querySelector('#crSettingsIntro').textContent=text.settingsIntro;page.querySelector('#crTabEnabledLabel').textContent=text.enabled;page.querySelector('#crTabEnabledHelp').textContent=text.enabledHelp;page.querySelector('#crTabNameLabel').textContent=text.tabName;page.querySelector('#crTabNameHelp').textContent=text.tabNameHelp;page.querySelector('#crSettingsSave').textContent=text.save}
    function setBusy(b){busyCount=Math.max(0,busyCount+(b?1:-1));if(b&&busyCount===1&&window.Dashboard)Dashboard.showLoadingMsg();if(!b&&busyCount===0&&window.Dashboard)Dashboard.hideLoadingMsg()}
    function showError(m){errorBox.textContent=m;errorBox.hidden=!m}
    function showPanel(name){const active=name==='requests';page.querySelector('#crRequestsPanel').hidden=!active;page.querySelector('#crSettingsPanel').hidden=active;page.querySelector('#crRequestsNav').className='raised '+(active?'button-submit':'button-alt')+' emby-button';page.querySelector('#crSettingsNav').className='raised '+(active?'button-alt':'button-submit')+' emby-button'}
    function makeButton(label,cls){const b=document.createElement('button');b.type='button';b.setAttribute('is','emby-button');b.className=cls;b.textContent=label;return b}
    function statusSelect(item){const w=document.createElement('div');w.className='selectContainer';const l=document.createElement('label');l.className='selectLabel';l.textContent=text.status;const s=document.createElement('select');s.setAttribute('is','emby-select');s.className='emby-select-withcolor emby-select cr-status';s.dataset.id=value(item,'Id');statuses.forEach(status=>{const o=document.createElement('option');o.value=status;o.textContent=text[status];s.appendChild(o)});s.value=value(item,'Status')||'Pending';w.append(l,s);return w}
    function requestElement(item){const a=document.createElement('article');a.className='cr-item';const title=document.createElement('h3');title.className='cr-title';title.textContent=value(item,'Title');const type=document.createElement('span');type.className='cr-type';const canonical=value(item,'ContentType');type.textContent=text[canonical]||canonical;const heading=document.createElement('div');heading.append(title,type);const head=document.createElement('div');head.className='cr-head';head.appendChild(heading);const meta=document.createElement('p');meta.className='cr-meta';meta.textContent=text.requestedBy+' '+value(item,'RequestedBy')+' · '+new Date(value(item,'CreatedAtUtc')).toLocaleString(language==='de'?'de-DE':'en-US');a.append(head,meta);const commentText=value(item,'Comment');if(commentText){const comment=document.createElement('p');comment.className='cr-comment';comment.textContent=commentText;a.appendChild(comment)}const actions=document.createElement('div');actions.className='cr-actions';const del=makeButton(text.delete,'raised button-cancel emby-button cr-delete');del.dataset.id=value(item,'Id');actions.append(statusSelect(item),del);a.appendChild(actions);return a}
    function render(){const selected=filter.value,visible=selected==='All'?requests:requests.filter(x=>(value(x,'Status')||'Pending')===selected),pending=requests.filter(x=>(value(x,'Status')||'Pending')==='Pending').length;summary.textContent=text.total(requests.length,pending);list.replaceChildren();if(!visible.length){const e=document.createElement('p');e.className='cr-empty';e.textContent=selected==='All'?text.emptyAll:text.emptyStatus(text[selected]);list.appendChild(e);return}visible.forEach(x=>list.appendChild(requestElement(x)))}
    async function loadRequests(){showError('');setBusy(true);try{const r=await ApiClient.ajax({url:ApiClient.getUrl('ContentRequests'),type:'GET',headers:{Accept:'application/json'}});requests=await r.json();render()}catch(e){console.error('Content Requests: load failed',e);showError(text.loadError)}finally{setBusy(false)}}
    async function loadSettings(){setBusy(true);try{const r=await ApiClient.ajax({url:ApiClient.getUrl('ContentRequests/DisplaySettings'),type:'GET',headers:{Accept:'application/json'}}),s=await r.json();page.querySelector('#crTabEnabled').checked=s.TabEnabled??s.tabEnabled??true;page.querySelector('#crTabName').value=s.TabName??s.tabName??'Requests'}catch(e){console.error('Content Requests: settings load failed',e);settingsMessage.textContent=text.settingsLoadError;settingsMessage.className='cr-message error'}finally{setBusy(false)}}
    async function updateStatus(s){s.disabled=true;try{await ApiClient.ajax({url:ApiClient.getUrl('ContentRequests/'+encodeURIComponent(s.dataset.id)+'/Status'),type:'PUT',data:JSON.stringify({Status:s.value}),headers:{Accept:'application/json','Content-Type':'application/json'}});await loadRequests()}catch(e){console.error('Content Requests: status update failed',e);showError(text.updateError);s.disabled=false}}
    async function deleteRequest(b){if(!confirm(text.confirmDelete))return;b.disabled=true;try{await ApiClient.ajax({url:ApiClient.getUrl('ContentRequests/'+encodeURIComponent(b.dataset.id)),type:'DELETE'});await loadRequests()}catch(e){console.error('Content Requests: delete failed',e);showError(text.deleteError);b.disabled=false}}
    async function saveSettings(event){event.preventDefault();settingsMessage.textContent='';setBusy(true);try{await ApiClient.ajax({url:ApiClient.getUrl('ContentRequests/DisplaySettings'),type:'PUT',data:JSON.stringify({TabEnabled:page.querySelector('#crTabEnabled').checked,TabName:page.querySelector('#crTabName').value.trim()}),headers:{Accept:'application/json','Content-Type':'application/json'}});settingsMessage.textContent=text.saved;settingsMessage.className='cr-message success'}catch(e){console.error('Content Requests: settings save failed',e);settingsMessage.textContent=text.settingsSaveError;settingsMessage.className='cr-message error'}finally{setBusy(false)}}
    function initialize(){applyTranslations();loadRequests();loadSettings()}
    page.querySelector('.cr-subnav').addEventListener('click',e=>{const target=e.target.closest('[data-panel]');if(target)showPanel(target.dataset.panel)});page.addEventListener('pageshow',initialize);page.addEventListener('viewshow',initialize);refresh.addEventListener('click',loadRequests);filter.addEventListener('change',render);settingsForm.addEventListener('submit',saveSettings);list.addEventListener('change',e=>{if(e.target.classList.contains('cr-status'))updateStatus(e.target)});list.addEventListener('click',e=>{const b=e.target.closest('.cr-delete');if(b)deleteRequest(b)});showPanel('requests');setTimeout(initialize,0);
})();
</script>
</div>
</body>
</html>
