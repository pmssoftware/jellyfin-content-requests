<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request content</title>
    <style>
        :root {
            color-scheme: dark;
            --cr-text: #f4f4f4;
            --cr-muted: #b9b9b9;
            --cr-surface: rgba(24, 24, 24, .9);
            --cr-field: rgba(0, 0, 0, .34);
            --cr-border: rgba(255, 255, 255, .16);
            --cr-accent: #00a4dc;
            --cr-success: #59c589;
            --cr-error: #ff7b7b;
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            padding: clamp(1rem, 3vw, 3rem);
            background: transparent;
            color: var(--cr-text);
            font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .portal {
            width: min(72rem, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 1.25rem;
            align-items: start;
        }

        .request-card, .history-card {
            padding: clamp(1.25rem, 4vw, 2.5rem);
            border: 1px solid var(--cr-border);
            border-radius: 1rem;
            background: var(--cr-surface);
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, .25);
            backdrop-filter: blur(14px);
        }

        h1 { margin: 0; font-size: clamp(1.65rem, 4vw, 2.25rem); }
        .intro { margin: .45rem 0 1.75rem; color: var(--cr-muted); }
        .field { margin: 0 0 1.15rem; }

        label {
            display: block;
            margin-bottom: .4rem;
            font-weight: 650;
        }

        input, select, textarea {
            display: block;
            width: 100%;
            border: 1px solid var(--cr-border);
            border-radius: .45rem;
            background: var(--cr-field);
            color: var(--cr-text);
            padding: .8rem .9rem;
            font: inherit;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--cr-accent);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--cr-accent) 28%, transparent);
        }

        textarea { min-height: 8rem; resize: vertical; }
        .optional { color: var(--cr-muted); font-size: .87em; font-weight: 400; }

        button {
            width: 100%;
            min-height: 3rem;
            border: 0;
            border-radius: .45rem;
            background: var(--cr-accent);
            color: #fff;
            padding: .75rem 1rem;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover { filter: brightness(1.08); }
        button:disabled { cursor: wait; opacity: .65; }

        .message {
            display: none;
            margin-top: 1rem;
            padding: .8rem 1rem;
            border-radius: .45rem;
            background: rgba(255, 255, 255, .08);
        }

        .message.visible { display: block; }
        .message.success { color: var(--cr-success); }
        .message.error { color: var(--cr-error); }
        .history-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
        .history-header h2 { margin: 0; font-size: 1.4rem; }
        .history-refresh { width: auto; min-height: 2.4rem; padding: .45rem .8rem; background: rgba(255,255,255,.12); }
        .history-list { display: grid; gap: .8rem; margin-top: 1rem; }
        .history-item { border: 1px solid var(--cr-border); border-radius: .65rem; padding: 1rem; background: rgba(0,0,0,.16); }
        .history-title { margin: 0; font-size: 1.05rem; }
        .history-meta { color: var(--cr-muted); font-size: .9rem; margin: .3rem 0; }
        .history-status { display: inline-block; border-radius: 999px; padding: .2rem .65rem; color: #fff; background: #59636b; font-size: .86rem; }
        .history-status.Approved { background: #356f9c; }
        .history-status.Available { background: #277a4e; }
        .history-status.Declined { background: #8a4141; }
        .history-response { margin: .75rem 0 0; padding: .7rem .8rem; border-left: 3px solid var(--cr-accent); background: rgba(0,164,220,.08); white-space: pre-wrap; }
        .history-empty { color: var(--cr-muted); }
        @media (max-width: 55rem) { .portal { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="portal">
    <main class="request-card">
        <h1 id="pageTitle">Request content</h1>
        <p id="pageIntro" class="intro">Tell us what you would like to see added to Jellyfin.</p>

        <form id="requestForm">
            <div class="field">
                <label id="nameLabel" for="title">Name</label>
                <input id="title" name="title" type="text" maxlength="200" autocomplete="off" required>
            </div>

            <div class="field">
                <label id="typeLabel" for="contentType">Type</label>
                <select id="contentType" name="contentType" required>
                    <option value="Movie" data-label="movie">Movie</option>
                    <option value="TV Show" data-label="tvShow">TV show</option>
                    <option value="Anime" data-label="anime">Anime</option>
                    <option value="Documentary" data-label="documentary">Documentary</option>
                    <option value="Other" data-label="other">Other</option>
                </select>
            </div>

            <div class="field">
                <label for="comment"><span id="commentLabel">Comment</span> <span id="optionalLabel" class="optional">(optional)</span></label>
                <textarea id="comment" name="comment" maxlength="1000" placeholder="Year, edition, language, or anything else that helps"></textarea>
            </div>

            <button id="submitButton" type="submit">Send request</button>
            <div id="message" class="message" role="status" aria-live="polite"></div>
        </form>
    </main>
    <section class="history-card" aria-labelledby="historyTitle">
        <div class="history-header">
            <h2 id="historyTitle">My requests</h2>
            <button id="historyRefresh" class="history-refresh" type="button">Refresh</button>
        </div>
        <p id="historyIntro" class="intro">See whether your requests were reviewed and read the administrator's response.</p>
        <div id="historyList" class="history-list" aria-live="polite"></div>
    </section>
    </div>

    <script>
        (() => {
            const form = document.querySelector('#requestForm');
            const button = document.querySelector('#submitButton');
            const message = document.querySelector('#message');
            const historyList = document.querySelector('#historyList');
            const historyRefresh = document.querySelector('#historyRefresh');
            const translations = {
                en: {
                    pageTitle: 'Request content',
                    pageIntro: 'Tell us what you would like to see added to Jellyfin.',
                    name: 'Name', type: 'Type', comment: 'Comment', optional: '(optional)',
                    movie: 'Movie', tvShow: 'TV show', anime: 'Anime', documentary: 'Documentary', other: 'Other',
                    placeholder: 'Year, edition, language, or anything else that helps',
                    send: 'Send request', sending: 'Sending…',
                    sent: 'Request sent. Thank you!',
                    session: 'Your Jellyfin session could not be found. Refresh the page and sign in again.',
                    failed: 'The request could not be sent. Please try again.',
                    myRequests: 'My requests', historyIntro: 'See whether your requests were reviewed and read the administrator\'s response.',
                    refresh: 'Refresh', noRequests: 'You have not submitted any requests yet.', response: 'Administrator response',
                    Pending: 'Pending', Approved: 'Approved', Available: 'Available', Declined: 'Declined', historyFailed: 'Your requests could not be loaded.'
                },
                de: {
                    pageTitle: 'Inhalt anfragen',
                    pageIntro: 'Teile uns mit, was du gerne in Jellyfin sehen möchtest.',
                    name: 'Name', type: 'Typ', comment: 'Kommentar', optional: '(optional)',
                    movie: 'Film', tvShow: 'Serie', anime: 'Anime', documentary: 'Dokumentation', other: 'Sonstiges',
                    placeholder: 'Jahr, Fassung, Sprache oder andere hilfreiche Angaben',
                    send: 'Anfrage senden', sending: 'Wird gesendet…',
                    sent: 'Anfrage wurde gesendet. Vielen Dank!',
                    session: 'Deine Jellyfin-Sitzung wurde nicht gefunden. Lade die Seite neu und melde dich erneut an.',
                    failed: 'Die Anfrage konnte nicht gesendet werden. Bitte versuche es erneut.',
                    myRequests: 'Meine Anfragen', historyIntro: 'Sieh, ob deine Anfragen geprüft wurden, und lies die Antwort des Administrators.',
                    refresh: 'Aktualisieren', noRequests: 'Du hast noch keine Anfragen eingereicht.', response: 'Antwort des Administrators',
                    Pending: 'Offen', Approved: 'Genehmigt', Available: 'Verfügbar', Declined: 'Abgelehnt', historyFailed: 'Deine Anfragen konnten nicht geladen werden.'
                }
            };

            function selectedLanguage() {
                const candidates = [];
                try {
                    candidates.push(window.parent.document.documentElement.lang);
                    candidates.push(window.parent.localStorage.getItem('language'));
                } catch (_) {
                    // Browser language remains as a safe fallback.
                }
                candidates.push(navigator.language);
                return candidates.some(candidate => String(candidate || '').toLowerCase().startsWith('de')) ? 'de' : 'en';
            }

            const language = selectedLanguage();
            const text = translations[language];

            function applyTranslations() {
                document.documentElement.lang = language;
                document.title = text.pageTitle;
                document.querySelector('#pageTitle').textContent = text.pageTitle;
                document.querySelector('#pageIntro').textContent = text.pageIntro;
                document.querySelector('#nameLabel').textContent = text.name;
                document.querySelector('#typeLabel').textContent = text.type;
                document.querySelector('#commentLabel').textContent = text.comment;
                document.querySelector('#optionalLabel').textContent = text.optional;
                document.querySelector('#comment').placeholder = text.placeholder;
                document.querySelectorAll('#contentType option').forEach(option => {
                    option.textContent = text[option.dataset.label];
                });
                button.textContent = text.send;
                document.querySelector('#historyTitle').textContent = text.myRequests;
                document.querySelector('#historyIntro').textContent = text.historyIntro;
                historyRefresh.textContent = text.refresh;
            }

            function jellyfinClient() {
                try {
                    return window.parent && window.parent.ApiClient
                        ? window.parent.ApiClient
                        : window.ApiClient;
                } catch (_) {
                    return window.ApiClient;
                }
            }

            function showMessage(text, kind) {
                message.textContent = text;
                message.className = `message visible ${kind}`;
            }

            async function synchronizeCustomTab() {
                const client = jellyfinClient();
                if (!client || typeof client.ajax !== 'function') return;

                try {
                    const response = await client.ajax({
                        url: client.getUrl('ContentRequests/DisplaySettings'),
                        type: 'GET',
                        headers: { 'Accept': 'application/json' }
                    });
                    const settings = await response.json();
                    const enabled = settings.TabEnabled ?? settings.tabEnabled ?? true;
                    const tabName = settings.TabName ?? settings.tabName ?? 'Requests';
                    const frame = window.frameElement;
                    const tab = frame && frame.closest('[id^="customTab_"]');
                    if (!tab) return;

                    const suffix = tab.id.substring('customTab_'.length);
                    const parentDocument = window.parent.document;
                    const apply = () => {
                        const tabButton = parentDocument.querySelector(`#customTabButton_${suffix}`);
                        if (!tabButton) return false;
                        tabButton.style.display = enabled ? '' : 'none';
                        const label = tabButton.querySelector('.emby-button-foreground');
                        if (label) label.textContent = tabName;
                        return true;
                    };

                    if (!apply()) {
                        let attempts = 0;
                        const timer = window.setInterval(() => {
                            attempts += 1;
                            if (apply() || attempts >= 25) window.clearInterval(timer);
                        }, 200);
                    }
                } catch (error) {
                    console.warn('Content Requests: could not synchronize CustomTabs settings', error);
                }
            }

            async function readError(error) {
                try {
                    if (error && typeof error.json === 'function') {
                        const body = await error.json();
                        return body.Message || body.message || body.detail;
                    }
                } catch (_) {
                    // Fall through to the friendly generic message.
                }

                return null;
            }

            function value(item, name) {
                return item[name] ?? item[name.charAt(0).toLowerCase() + name.slice(1)];
            }

            function renderHistory(items) {
                historyList.replaceChildren();
                if (!items.length) {
                    const empty = document.createElement('p');
                    empty.className = 'history-empty';
                    empty.textContent = text.noRequests;
                    historyList.appendChild(empty);
                    return;
                }

                items.forEach(item => {
                    const card = document.createElement('article');
                    card.className = 'history-item';
                    const title = document.createElement('h3');
                    title.className = 'history-title';
                    title.textContent = value(item, 'Title');
                    const meta = document.createElement('p');
                    meta.className = 'history-meta';
                    meta.textContent = new Date(value(item, 'CreatedAtUtc')).toLocaleString(language === 'de' ? 'de-DE' : 'en-US');
                    const statusValue = value(item, 'Status') || 'Pending';
                    const status = document.createElement('span');
                    status.className = 'history-status ' + statusValue;
                    status.textContent = text[statusValue] || statusValue;
                    card.append(title, meta, status);
                    const responseValue = value(item, 'AdminResponse');
                    if (responseValue) {
                        const response = document.createElement('p');
                        response.className = 'history-response';
                        response.textContent = text.response + ': ' + responseValue;
                        card.appendChild(response);
                    }
                    historyList.appendChild(card);
                });
            }

            async function loadMine() {
                const client = jellyfinClient();
                if (!client || typeof client.ajax !== 'function') return;
                historyRefresh.disabled = true;
                try {
                    const response = await client.ajax({
                        url: client.getUrl('ContentRequests/Mine'),
                        type: 'GET',
                        headers: { 'Accept': 'application/json' }
                    });
                    renderHistory(await response.json());
                } catch (_) {
                    historyList.textContent = text.historyFailed;
                } finally {
                    historyRefresh.disabled = false;
                }
            }

            form.addEventListener('submit', async event => {
                event.preventDefault();
                message.className = 'message';

                const client = jellyfinClient();
                if (!client || typeof client.ajax !== 'function') {
                    showMessage(text.session, 'error');
                    return;
                }

                const payload = {
                    Title: form.elements.title.value.trim(),
                    ContentType: form.elements.contentType.value,
                    Comment: form.elements.comment.value.trim()
                };

                button.disabled = true;
                button.textContent = text.sending;

                try {
                    await client.ajax({
                        url: client.getUrl('ContentRequests'),
                        type: 'POST',
                        data: JSON.stringify(payload),
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        }
                    });

                    form.reset();
                    showMessage(text.sent, 'success');
                    form.elements.title.focus();
                    loadMine();
                } catch (error) {
                    const detail = await readError(error);
                    showMessage(detail || text.failed, 'error');
                } finally {
                    button.disabled = false;
                    button.textContent = text.send;
                }
            });

            applyTranslations();
            synchronizeCustomTab();
            historyRefresh.addEventListener('click', loadMine);
            loadMine();
        })();
    </script>
</body>
</html>
